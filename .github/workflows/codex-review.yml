name: Codex PR Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  codex-review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Codex code review
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            Review the changed code in this pull request carefully.
            For EACH issue you find, reply in this exact format:
            - **File:** <filename>
              **Line:** <line number>
              **Problem:** <short 1-line description of the issue>
              **Code:** `<the exact problematic line of code>`
            List every issue this way, one after another.
            If there are NO issues at all, reply only with:
            "No issues found. Looks good to merge."
            Do not summarize vaguely — always point to the specific file, line number, and code snippet when an issue exists.
      - name: Post Codex review as PR comment
        uses: actions/github-script@v7
        env:
          CODEX_OUTPUT: ${{ steps.run_codex.outputs.final-message }}
        with:
          script: |
            const output = process.env.CODEX_OUTPUT || "No review content returned.";
            const author = context.payload.pull_request.user.login;
            // Check if Codex found issues or not
            const noIssues = output.toLowerCase().includes("no issues found");
            const statusIcon = noIssues ? "✅" : "⚠️";
            const statusText = noIssues ? "No issues found" : "Issues found — please review";
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `**Codex Review:** ${statusIcon} ${statusText}\n\n${output}\n\n@${author} review complete ☝️`
            });
      # This step fails if Codex found issues (blocks merge), passes if clean (allows merge)
      - name: Fail the check if issues were found
        env:
          CODEX_OUTPUT: ${{ steps.run_codex.outputs.final-message }}
        run: |
          output="$CODEX_OUTPUT"
          if echo "$output" | grep -qi "no issues found"; then
            echo "No issues found. Check passes."
            exit 0
          else
            echo "Issues were found by Codex review. Failing this check to block merge."
            exit 1
          fi
      # This step only runs if everything above passed — merges the PR automatically
      - name: Auto-merge the pull request
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              merge_method: "squash"
            });
