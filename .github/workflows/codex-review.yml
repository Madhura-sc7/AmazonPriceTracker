name: Codex PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  codex-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Codex code review
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            Review this code briefly. Reply in short form:
            - If issues found: list them as short bullet points (max 1 line each)
            - If no issues: reply "No issues found. Looks good to merge."

      - name: Post Codex review as PR comment
        uses: actions/github-script@v7
        env:
          CODEX_OUTPUT: ${{ steps.run_codex.outputs.final-message }}
        with:
          script: |
            const output = process.env.CODEX_OUTPUT || "No review content returned.";
            const author = context.payload.pull_request.user.login;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `**Codex Review:**\n\n${output}\n\n@${author} review complete ☝️`
            });
